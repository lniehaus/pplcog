name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Unit tests
        run: uv run pytest -q
      - name: Model evaluation (smoke run, seconds)
        run: uv run pplcog
